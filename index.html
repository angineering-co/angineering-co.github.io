    <script>
        // --- Translation System ---
        let currentLanguage = 'zh-TW';
        let translations = {};

        // Load translations based on current language
        function loadTranslations(lang) {
            switch (lang) {
                case 'zh-TW':
                    translations = window.translations_zh_TW || {};
                    break;
                case 'en-US':
                    translations = window.translations_en_US || {};
                    break;
                case 'ja-JP':
                    translations = window.translations_ja_JP || {};
                    break;
                default:
                    translations = window.translations_zh_TW || {};
            }
        }

        // Apply translations to the page
        function applyTranslations() {
            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[key]) {
                    element.textContent = translations[key];
                }
            });
        }

        // Update language display
        function updateLanguageDisplay(lang) {
            const languageNames = {
                'zh-TW': '中文',
                'en-US': 'English',
                'ja-JP': '日本語'
            };

            document.getElementById('current-language').textContent = languageNames[lang];
            document.documentElement.setAttribute('lang', lang);
        }

        // Switch language
        function switchLanguage(lang) {
            currentLanguage = lang;
            loadTranslations(lang);
            applyTranslations();
            updateLanguageDisplay(lang);

            // Save preference
            localStorage.setItem('preferred-language', lang);

            // Close dropdown
            document.getElementById('language-dropdown').classList.add('hidden');
        }

        // Initialize translation system
        function initTranslations() {
            // Load saved language preference or default to zh-TW
            const savedLang = localStorage.getItem('preferred-language') || 'zh-TW';
            switchLanguage(savedLang);
        }

        // --- Mobile Menu Toggle ---
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        menuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Close mobile menu when a link is clicked
        const mobileLinks = mobileMenu.querySelectorAll('a');
        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });

        // --- Language Switcher Events ---
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize translations
            initTranslations();

            // Language switcher dropdown toggle
            const languageSwitcher = document.getElementById('language-switcher');
            const languageDropdown = document.getElementById('language-dropdown');

            languageSwitcher.addEventListener('click', (e) => {
                e.stopPropagation();
                languageDropdown.classList.toggle('hidden');
            });

            // Language option clicks
            document.querySelectorAll('.language-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    e.preventDefault();
                    const lang = option.getAttribute('data-lang');
                    switchLanguage(lang);
                });
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', () => {
                languageDropdown.classList.add('hidden');
            });
        });

    </script>
